services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: yelp-postgres
    environment:
      POSTGRES_DB: yelp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
        - "5433:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: